hidden_dim: 1024
esm_dim: 1280
base_lr: 4e-3

# 原型网络参数
n_way: 32                     # 每 batch 采样的 GO term 数
n_query: 10                    # 每个 GO term 的查询蛋白质数
n_support: 50                  # 每个 GO term 的支持蛋白质数（用于计算原型）

tau_min: 0                   # 可学习 tau 的下界，防止罕见类(n=1)原型坍缩到单样本；如 5 表示 n=1 的类 w<=1/6

dataset: TALE
datasets_path: './data_tale/'
mode: test                    # [train/test]
namespace: MF                 # [BP/CC/MF]
# 支持集和查询集平分所有正样本，然后随机取样n_query和n_support，不足时重复抽样。

zero_shot: True # 是否启用zero-shot的预测